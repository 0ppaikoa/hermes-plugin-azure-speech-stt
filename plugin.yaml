manifest_version: 1
name: azure-speech
label: Azure AI Speech
kind: standalone
version: 0.1.0
author: AokiApp Inc.
homepage: https://github.com/0ppaikoa/hermes-plugin-azure-speech-stt
license: MIT
description: >
  Azure AI Speech as a Hermes Agent speech-to-text provider, registering the name
  azure-speech. File transcription walks the Fast Transcription API with the MAI-Transcribe
  models (keyword biasing, word timestamps, diarization); the live path speaks the Realtime
  WebSocket protocol with MAI-Transcribe-2-Streaming for partial text while the user talks.
  One section per transport (oneshot / realtime), each with its own resource, model, language
  and credential, because a resource key opens only its own resource. No SDK dependency: plain
  HTTPS multipart and one WebSocket. Auth is a resource key or a Microsoft Entra token.
requires_hermes: ">=0.21.0"
provides_tools: []
provides_hooks: []
optional_env:
  - name: AZURE_SPEECH_API_KEY
    description: >
      Oneshot resource key. Leave blank to authenticate with Microsoft Entra ID instead. The
      variable name the plugin reads is configurable: stt.azure-speech.oneshot.api_key_env.
    prompt: "Azure Speech resource key (oneshot)"
    password: true
  - name: AZURE_SPEECH_API_KEY_REALTIME
    description: >
      Realtime resource key, needed only when stt.azure-speech.realtime is configured and lives
      on another resource. Configurable: stt.azure-speech.realtime.api_key_env.
    prompt: "Azure Speech resource key (realtime)"
    password: true
