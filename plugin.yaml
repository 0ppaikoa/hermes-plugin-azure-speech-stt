manifest_version: 1
name: azure-speech
label: Azure AI Speech
kind: standalone
version: 0.1.0
author: AokiApp Inc.
homepage: https://github.com/0ppaikoa/hermes-plugin-azure-speech-stt
license: MIT
description: >
  Azure AI Speech as a Hermes Agent speech-to-text provider, registering the name
  azure-speech. File transcription walks the Fast Transcription API with the MAI-Transcribe
  models (keyword biasing, word timestamps, diarization); the live path speaks the Realtime
  WebSocket protocol with MAI-Transcribe-2-Streaming for partial text while the user talks.
  One location and one model are configured; endpoints and the live deployment name are
  derived, so the live path costs no extra config keys. No SDK dependency: plain HTTPS
  multipart and one WebSocket. Auth is a resource key or a Microsoft Entra token.
requires_hermes: ">=0.21.0"
provides_tools: []
provides_hooks: []
optional_env:
  - name: AZURE_SPEECH_API_KEY
    description: >
      Resource key. Leave blank to authenticate with Microsoft Entra ID instead. The variable
      name the plugin reads is configurable per profile: stt.azure-speech.api_key_env.
    prompt: "Azure Speech resource key"
    password: true
